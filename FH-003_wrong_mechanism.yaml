  - "spectrum_analyzer"
max_tool_calls: 12

source: "Classic organic chemistry competition between SN2 and E2 mechanisms, documented in Clayden, Greeves, Warren 'Organic Chemistry' and March's 'Advanced Organic Chemistry'"
expert_validated: false
tags: ["organic_chemistry", "SN2", "E2", "elimination", "substitution", "temperature", "mechanism"]
