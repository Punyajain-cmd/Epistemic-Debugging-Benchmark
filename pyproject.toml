[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epidebug"
version = "0.2.0"
description = "Epistemic Debugging Benchmark and researcher-facing diagnostic engine"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Epistemic Debugging Team"},
]
keywords = ["benchmark", "evaluation", "scientific-reasoning", "ai-safety", "epistemic-debugging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "click>=8.0",
    "jinja2>=3.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
eval = [
    "inspect-ai>=0.3",
    "openai>=1.0",
    "anthropic>=0.20",
    "google-genai>=1.0",
]
scoring = [
    "sentence-transformers>=2.2",
    "scikit-learn>=1.3",
]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.27",
    "ruff>=0.4",
]
all = ["epidebug[eval,scoring,dev,web]"]

[project.scripts]
epidebug = "scripts.run_benchmark:main"
epidebug-serve = "web.app:main"

[tool.setuptools.packages.find]
include = ["epidebug*", "web"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
