  - "buffer_stability_reference"
  - "ni_nta_binding_conditions"
  - "gel_imager"
  - "spectrophotometer"
max_tool_calls: 15

source: "Composite case based on common Ni-NTA purification failures documented in protein biochemistry literature and manufacturer troubleshooting guides (Qiagen, Thermo Fisher)"
expert_validated: false
tags: ["protein_purification", "buffer_chemistry", "pH", "affinity_chromatography", "His-tag", "Ni-NTA", "CO2"]
